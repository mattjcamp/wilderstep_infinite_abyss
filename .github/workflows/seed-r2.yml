name: Seed engine modules to R2

# When shipped/engine module content changes on `main`, re-upload it to
# the hosted R2 bucket so the deployed (remote-mode) site serves the
# update.
#
# Why this is needed: in hosted mode the worker reads the core modules
# (default, the libraries) from R2 — NOT from the static bundle. So a git
# push + Pages rebuild updates the *static* copy but leaves R2 stale, and
# the change never shows on the live site. This job closes that gap: edit
# engine content locally → commit/push → R2 is updated automatically,
# matching the principle that core game content lives with the game and
# the hosting layer just mirrors it for players.
#
# One-time setup — add these repository secrets
# (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token with "R2 Storage: Edit" on the
#                            account that owns the wilderstep-ugc bucket.
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id.
#
# Scope note: this re-seeds module DATA (idempotent overwrite of every
# shipped module file). If you ADD or REMOVE a shipped module, also hit
# <worker-url>/reindex once in a signed-in browser to rebuild the catalog
# index — that endpoint requires Access auth, which CI can't provide, so
# it's intentionally left manual. Editing data inside an existing module
# (the common case) needs no reindex.

on:
  push:
    branches: [main]
    paths:
      - "web/public/modules/**"
  # Allow a manual run from the Actions tab (e.g. after a reindex, or to
  # force a re-seed).
  workflow_dispatch:

permissions:
  contents: read

# Never run two seeds at once; don't cancel an in-flight one (R2 puts are
# sequential and idempotent, but overlapping runs waste API calls).
concurrency:
  group: seed-r2
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install wrangler so the seed script's `wrangler r2 object put`
      # calls resolve without a per-file download.
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Seed shipped modules into R2
        working-directory: web/workers/publish-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Modules only (no --sprites): fast, and covers map/monster/quest
        # data edits. Add --sprites here if you start shipping engine art
        # that hosted players need.
        run: node seed-bucket.mjs
