name: Deploy redirect to GitHub Pages

# The game now lives on Cloudflare Pages (https://wilderstep.pages.dev/).
# This workflow no longer builds the Next.js app — instead it publishes a
# tiny set of redirect stubs from `pages-redirect/` so that anyone hitting
# the old github.io URL is forwarded to the new site (path/query/hash
# preserved, base prefix stripped).
#
# Triggered on every push to `main` and manually via the Actions tab.
#
# Prereqs (one-time setup in the repository):
#   Settings → Pages → "Build and deployment" → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to Pages and authenticate via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. Don't cancel an in-flight deploy if
# a new push lands — the next one waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

      - id: deployment
        uses: actions/deploy-pages@v4
