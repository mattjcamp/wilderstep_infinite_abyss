<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wilderstep has moved</title>
  <link rel="canonical" href="https://wilderstep.pages.dev/">
  <meta name="robots" content="noindex">
  <script>
    // Redirect github.io visitors to the new Cloudflare Pages site,
    // preserving the path (minus the "/<repo>/" base prefix), query, and hash.
    (function () {
      var base = "/wilderstep_infinite_abyss";
      var path = location.pathname;
      if (path.indexOf(base) === 0) path = path.slice(base.length);
      if (path.charAt(0) !== "/") path = "/" + path;
      location.replace("https://wilderstep.pages.dev" + path + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://wilderstep.pages.dev/">
</head>
<body>
  <p>Wilderstep has moved to <a href="https://wilderstep.pages.dev/">wilderstep.pages.dev</a>. Redirecting&hellip;</p>
</body>
</html>
