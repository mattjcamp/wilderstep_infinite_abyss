# publish-api — Cloudflare Worker for player module publishing.
# See ../../../docs/dev_guides/ugc_api_contract.md and worker.mjs.
#
# ── Production setup checklist ─────────────────────────────────────
#   1. R2 bucket exists (wilderstep-ugc) and is seeded
#      (node seed-bucket.mjs [--sprites]).
#   2. Create a Cloudflare Access application (Zero Trust → Access →
#      Applications → Self-hosted):
#        - Application domain: wilderstep-publish-api.<subdomain>.workers.dev
#          path: /login            ← protect ONLY this path
#        - Policy: Allow → Emails → your email(s)
#        - Login method: One-time PIN is the zero-setup option
#      Copy the application's AUD tag (Overview tab) and your team
#      domain (<team>.cloudflareaccess.com).
#   3. Fill in the [vars] below and `npx wrangler deploy`.
#   4. Verify: open <worker>/login in a browser → Access login →
#      redirected; then <worker>/status in the same browser shows
#      authenticated: true with your handle.
#
# Local dev (`wrangler dev`): set DEV_ALLOW_ANON/DEV_HANDLE via
#   npx wrangler dev --var DEV_ALLOW_ANON:true --var DEV_HANDLE:dev
# NEVER set those on a deployed environment — they bypass auth.

name = "wilderstep-publish-api"
main = "worker.mjs"
compatibility_date = "2026-06-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wilderstep-ugc"

[vars]
# Access JWT verification (auth fails closed while these are unset —
# nobody can publish, reads still work).
ACCESS_TEAM_DOMAIN = "little-tree-b24e.cloudflareaccess.com"
# AUD tag from the Access application (Zero Trust → Access →
# Applications → <app> → Overview). Uncomment once created:
ACCESS_AUD = "157678c7a07971508db31e525d6499f413c461a40f015b67a2b28cf3a2885256"

# Origins allowed to make credentialed calls (the editor's deployed
# origins + local dev). Comma-separated, EXACT origins (scheme + host,
# no trailing slash). Add a custom domain here too once one points at
# the Pages project.
ALLOWED_ORIGINS = "http://localhost:3000,https://wilderstep.pages.dev"

# Where /login bounces after Access authenticates. A ?return= param
# matching ALLOWED_ORIGINS overrides it (the editor's Sign-in link
# passes one), so this default only matters for hand-typed /login
# visits. Points at the deployed Cloudflare Pages editor.
LOGIN_REDIRECT_URL = "https://wilderstep.pages.dev/editor/"

# Identity → publish handle map (pre-D1 stand-in for the users
# table). JSON object of email → handle; emails not in the map fall
# back to a sanitised local-part.
HANDLE_MAP = '{ "mjcampbell74@gmail.com": "matt" }'
